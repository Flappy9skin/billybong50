<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open in About:Blank</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a2e;
            font-family: Arial, sans-serif;
        }
        button {
            padding: 25px 50px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.6);
        }
    </style>
</head>
<body>
    <button onclick="openInBlank()">Click Here</button>

    <script>
        function openInBlank() {
            const targetUrl = 'https://billybong50.github.io/realhome';
            
            const content = `
            <!DOCTYPE html>
            <html>
            <head>
                <title>Home</title>
                <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
                <style>
                    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; }
                    iframe { border: none; width: 100%; height: 100%; }
                </style>
            </head>
            <body>
                <iframe src="${targetUrl}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads allow-pointer-lock"></iframe>
                <script>
                    window.addEventListener('keydown', function(e) {
                        if (e.key.toLowerCase() === 'q') {
                            window.location.replace('https://classroom.google.com');
                        }
                    });
                <\/script>
            </body>
            </html>`;

            const newWin = window.open('about:blank', '_blank');
            if (newWin) {
                newWin.document.open();
                newWin.document.write(content);
                newWin.document.close();
            } else {
                alert('Popup blocked! Please allow popups for this site.');
            }
        }
    </script>
</body>
<head>
</head>    
   <body>
<script type="text/javascript">
    setTimeout(function() {
        window.location.href = "https://powerschool.sandi.net/guardian/home.html";
    }, 3000); 
</script>
   </body> 
</html>
